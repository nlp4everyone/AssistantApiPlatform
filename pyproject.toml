[project]
name = "chatengine"
version = "0.1.0"
description = "Chat Engine with AI capabilities"
requires-python = ">=3.9,<3.10"
dependencies = [
    # Core
    "fastapi==0.100.0",
    "python-multipart==0.0.20",
    "uvicorn==0.34.2",
    "python-dotenv==1.0.0",
    "loguru==0.7.3",
    "StrEnum==0.4.15",
    # LLM client
    "openai==1.109.1",
    # Background task
    "taskiq==0.11.18",
    "taskiq-redis==1.1.0",
    # Config
    "toml==0.10.2",
    # Postgres
    "asyncpg==0.29.0",
    # Tracker
    "mlflow-skinny==3.1.4",
    # mlflow's BaseMlflowSpanProcessor doesn't call super().__init__(), so it
    # breaks on opentelemetry-sdk>=1.41 which requires self._metrics to be set
    "opentelemetry-sdk<1.41",
    "opentelemetry-api<1.41",
    # S3 (used by mlflow's S3 artifact/trace exporter, not imported directly)
    "boto3==1.40.50",
    "minio==7.2.17",
    # Token counter
    "tiktoken==0.9.0",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
